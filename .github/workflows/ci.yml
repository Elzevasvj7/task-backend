name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write # Permite a la acción crear tags y releases en Git

jobs:
  validate:
    name: Code Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Audit dependencies for security vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm run test:cov

      - name: Build TypeScript application
        run: pnpm run build

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Calcula la siguiente versión según Conventional Commits y crea el tag en GitHub
      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # 2. Configura credenciales de AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Configura Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Compila la imagen localmente etiquetada con la versión SemVer y con el SHA del commit
      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag_version.outputs.new_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # 6. Escanea la imagen con Trivy (bloquea si hay vulnerabilidades críticas)
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag_version.outputs.new_tag }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # 7. Sube ambas etiquetas a Amazon ECR
      - name: Push Docker images to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag_version.outputs.new_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # 8. Renderiza la Task Definition inyectando el nuevo tag semántico
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: task-backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag_version.outputs.new_tag }}

      # 9. Despliega en ECS Fargate con Blue/Green y espera estabilidad
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
      
      # 10. Smoke Test resiliente con reintentos contra el puerto 80 del ALB
      - name: Smoke test the deployed service
        run: |
          echo "Iniciando Smoke Tests contra: http://${{ vars.ALB_DNS }}"
          
          MAX_RETRIES=5
          DELAY=5
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Intento $i de $MAX_RETRIES..."
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ vars.ALB_DNS }}/health)
            
            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Intento $i exitoso! (HTTP $RESPONSE). Smoke test pasó."
              SUCCESS=true
              break
            else
              echo "⚠️ Intento $i falló (HTTP $RESPONSE). Reintentando en ${DELAY}s..."
              sleep $DELAY
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Smoke test falló tras $MAX_RETRIES intentos. Despliegue no confiable."
            exit 1
          fi
      # 11. Envía una notificación enriquecida a Discord (Éxito o Fallo)
      - name: Notify deployment status to Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "🚀 Despliegue: task-backend"
          description: "Versión ${{ steps.tag_version.outputs.new_tag }} procesada con Blue/Green en AWS ECS."