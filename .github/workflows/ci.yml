name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Audit dependencies for security vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests with coverage
        run: pnpm run test:cov

      - name: Build TypeScript application
        run: pnpm run build

  deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Compilamos la imagen localmente en el runner
      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # 2. Escaneamos la imagen con Trivy (Shift-Left Security)
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # 3. Solo si Trivy pasa limpio, hacemos push a ECR
      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # 4. Inyectamos la nueva imagen en la Task Definition
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: task-backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # 5. Desplegamos en ECS Fargate y esperamos estabilidad
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
      
      - name: Smoke test the deployed service
        run: |
          echo "Iniciando Smoke Tests contra: http://${{ vars.ALB_DNS }}"
          
          MAX_RETRIES=5
          DELAY=5
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Intento $i de $MAX_RETRIES..."
            
            # 1. Hacemos la peticion guardando codigo HTTP y cuerpo
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ vars.ALB_DNS }}/health)
            
            # Separamos el cuerpo y el codigo HTTP

            # 2. Verificamos codigo 200 Y que el JSON contenga '"status":"ok"'
            if [ "$RESPONSE" -eq 200 ]; then
              echo "Intento $i exitoso! (HTTP $RESPONSE). Smoke test pasó."
              SUCCESS=true
              break
            else
              echo "Intento $i falló (HTTP $RESPONSE). Reintentando en ${DELAY}s..."
              sleep $DELAY
            fi
          done

          # 3. Si despues de todos los intentos no tuvo exito, rompemos el pipeline
          if [ "$SUCCESS" = false ]; then
            echo "Smoke test falló tras $MAX_RETRIES intentos. Despliegue no confiable."
            exit 1
          fi
      